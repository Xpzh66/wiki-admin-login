<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki Admin Login</title>
    <!-- Shared stylesheet -->
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
    <!-- Login card: binds form fields to the User model object -->
    <div class="card">
        <h1>Wiki Administrator Login</h1>

        <form th:action="@{/login}" th:object="${user}" method="post">
            <!-- Username field: bound to user.username -->
            <label for="username">Username</label>
            <input type="text" id="username" th:field="*{username}"
                   placeholder="Enter your username" required>

            <!-- Password field: bound to user.password -->
            <label for="password">Password</label>
            <input type="password" id="password" th:field="*{password}"
                   placeholder="Enter your password" required>

            <!-- Submit button sends the POST request to /login -->
            <button type="submit" class="login-btn">Login</button>
        </form>
    </div>
</body>
</html>
