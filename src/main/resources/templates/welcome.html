<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
    <!-- Success page: shows the welcome message passed from the controller -->
    <div class="card">
        <h1 th:text="${message}">Welcome!</h1>
        <p>You have successfully logged in to the Wiki administration area.</p>

        <!-- Link back to the login page (logout / login again) -->
        <a th:href="@{/login}" href="/login" class="link-btn">Back to Login</a>
    </div>
</body>
</html>
